<!doctype html>
<html>
<head><meta charset="utf-8"><title>TaskCard — preview</title></head>
<body>
<div class="dq-stage-col" style="max-width:520px">
  <article class="dq-task">
    <span class="dq-task-icon dq-bg-emerald"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18c4-8 12-8 16 0"/><path d="M4 18h16"/></svg></span>
    <div class="dq-task-body">
      <p class="dq-task-title">Tính toán thoát nước dọc đoạn qua khu dân cư</p>

      <p class="dq-task-title">Nộp hồ sơ thẩm định BVTC — gói thầu 02</p>

</html>
