<!-- @dsCard group="Khối và thẻ" height=360 subtitle="container chuẩn của Dashboard" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DashboardPanel — preview</title></head>
<body>
<div style="padding:16px;max-width:560px">
  <section class="dq-panel">
    <div class="dq-panel-head">
      <span class="dq-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>
      <h2 class="dq-panel-title">Việc hôm nay</h2>
      <span class="dq-panel-sub">Thứ Bảy</span>
      <span class="dq-count">3</span>
    </div>
    <article class="dq-task">
      <span class="dq-task-icon dq-bg-sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M5 20V9l7-5 7 5v11"/></svg></span>
      <div class="dq-task-body">
        <p class="dq-task-title">Rà soát trắc dọc tuyến Km0+000 – Km1+500</p>
        <div class="dq-task-meta"><span class="dq-status"><span class="dq-dot dq-dot-in-progress"></span>Đang làm</span><span>09:00 – 11:00</span><span class="dq-chip dq-chip-important"><span class="dq-dot"></span>Quan trọng</span></div>
      </div>
    </article>
    <article class="dq-task">
      <span class="dq-task-icon dq-bg-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
      <div class="dq-task-body">
        <p class="dq-task-title">Hoàn thiện bảng THKL cống hộp</p>
        <div class="dq-task-meta"><span class="dq-status"><span class="dq-dot dq-dot-in-review"></span>Chờ duyệt</span><span>14:00</span></div>
      </div>
    </article>
  </section>
</div>
</body>
</html>
